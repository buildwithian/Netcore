<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>MTN One × Netcore — Commercials V17</title><style>html,body{margin:0;background:#fff}iframe{display:block;width:100%;border:0;min-height:100vh}</style></head><body><iframe id="page" src="../mtn-one-v15/index.html" title="MTN One Commercials V17 test"></iframe><script>(()=>{const f=document.getElementById('page');function patch(){const d=f.contentDocument;if(!d)return;const pop=d.querySelector('.info-pop');if(pop){pop.innerHTML='<b>MTU = Monthly Tracked Users:</b> A usage metric measuring unique individual users who perform tracked actions in a month—ensuring costs align directly with active platform engagement rather than total volume of activity.<details class="mtu-more"><summary>More on MTU</summary><div class="mtu-more-body"><p><strong>Volume-Independent:</strong> No matter how many events or sessions a single user generates in a month, they only count as 1 MTU.</p><p><strong>Identity Merging:</strong> Anonymous visitors who later log in are recognized as a single user, preventing duplicate user counts.</p><p><strong>Monthly Reset:</strong> Quotas reset at the start of each billing cycle with no rollover of unused capacity.</p></div></details>'}if(!d.getElementById('v17-patch')){const s=d.createElement('style');s.id='v17-patch';s.textContent='.mtu-more{margin-top:9px;border-top:1px solid #ecece7;padding-top:8px}.mtu-more summary{cursor:pointer;font-size:12px;font-weight:850;color:#f26522;list-style:none}.mtu-more summary::-webkit-details-marker{display:none}.mtu-more summary:after{content:" +"}.mtu-more[open] summary:after{content:" −"}.mtu-more-body{margin-top:7px}.mtu-more-body p{margin:0 0 7px;font-size:11.5px;line-height:1.4;color:#555b61}.tier-card{cursor:pointer}.tier-card.active:after{content:"Selected";position:absolute;top:8px;right:9px;font-size:8.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#111;background:#fff;border:1px solid #111;border-radius:999px;padding:3px 6px}.tier-card:focus{outline:3px solid rgba(242,101,34,.28);outline-offset:2px}.schedule-hint{margin:9px 0 0;color:#72777c;font-size:12px;font-weight:700}@media(max-width:620px){.fee{font-size:54px!important}.mobile-scale{margin-top:8px!important}.mobile-scale span{font-size:16px!important;font-weight:950!important;color:#25292d!important;line-height:1.05!important;letter-spacing:-.015em!important;white-space:normal!important}.mobile-scale span:nth-child(-n+2){color:#665400!important}}@media(max-width:390px){.fee{font-size:50px!important}.mobile-scale span{font-size:15px!important}}';d.head.appendChild(s)}const legend=d.querySelector('.legend');if(legend&&!d.querySelector('.schedule-hint')){const p=d.createElement('p');p.className='schedule-hint';p.textContent='Tap any pricing tier to update the calculator.';legend.insertAdjacentElement('afterend',p)}const slider=d.querySelector('[data-tier-slider]');function wire(){d.querySelectorAll('.tier-card').forEach((c,i)=>{if(c.dataset.v17wired)return;c.dataset.v17wired='1';c.setAttribute('role','button');c.setAttribute('tabindex','0');const go=()=>{if(!slider)return;slider.value=String(i);slider.dispatchEvent(new Event('input',{bubbles:true}));d.querySelectorAll('.tier-card').forEach((x,j)=>x.setAttribute('aria-pressed',String(j===i)))};c.addEventListener('click',go);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})})}wire();const cards=d.querySelector('[data-tier-cards]');if(cards&&!cards.dataset.v17observer){cards.dataset.v17observer='1';new MutationObserver(wire).observe(cards,{childList:true})}const ro=new ResizeObserver(()=>{f.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+'px'});ro.observe(d.body);f.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}f.addEventListener('load',()=>{patch();setTimeout(patch,250);setTimeout(patch,800)});})();</script></body></html>
