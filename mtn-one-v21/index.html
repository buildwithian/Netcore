<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>MTN One × Netcore — Commercials V21</title><style>html,body{margin:0;background:#fff}iframe{display:block;width:100%;border:0;min-height:100vh}</style></head><body><iframe id="v20" title="MTN One Commercials V21 test"></iframe><script>(()=>{const host=document.getElementById('v20');host.src='../mtn-one-v20/index.html'+location.search;function patch(){const d20=host.contentDocument;if(!d20)return;const o=d20.getElementById('outer');if(!o)return;const d19=o.contentDocument;if(!d19)return;const inner=d19.getElementById('page');if(!inner)return;const d=inner.contentDocument;if(!d)return;if(!d.getElementById('v21-style')){const s=d.createElement('style');s.id='v21-style';s.textContent=`.growth-info-wrap{position:relative;display:inline-block;margin-top:13px}.growth-info-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #deded8;background:#fff;color:#0b0d0f;border-radius:999px;padding:8px 9px 8px 12px;font-size:13px;font-weight:900}.growth-info-btn i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#f1f1ee;color:#50565c;font-style:normal;font-size:12px;font-weight:900}.growth-info-pop{display:none;position:absolute;left:0;top:44px;width:min(430px,82vw);padding:13px 14px;background:#fff;border:1px solid #deded8;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.13);font-size:13px;line-height:1.45;color:#454b51;z-index:50}.growth-info-wrap:hover .growth-info-pop,.growth-info-wrap.open .growth-info-pop{display:block}.growth-info-pop strong{color:#0b0d0f}.mobile-scale span{min-width:0;text-align:center!important}.mobile-scale b{display:block;font-size:19px!important;font-weight:950!important;line-height:1!important;color:#23272b!important}.mobile-scale small{display:block;margin-top:3px;font-size:10.5px!important;font-weight:900!important;line-height:1.05!important;color:#454b51!important;white-space:normal!important}.mobile-scale span:nth-child(-n+2) b,.mobile-scale span:nth-child(-n+2) small{color:#665400!important}@media(max-width:620px){.mobile-scale{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:2px!important;margin-top:8px!important}.scale-labels{display:none!important}.growth-info-pop{position:fixed;left:20px;right:20px;top:auto;width:auto}.growth-info-btn{font-size:12.5px}}@media(max-width:390px){.mobile-scale b{font-size:18px!important}.mobile-scale small{font-size:10px!important}}`;d.head.appendChild(s)}const hero=d.querySelector('.hero .hero-grid>div:first-child');if(hero){const p=hero.querySelector('p:not(.eyebrow)');if(p&&p.textContent.includes('Growth Partner'))p.textContent='Investment follows actual adoption, with shared accountability introduced as MTN One scales.';if(!hero.querySelector('[data-growth-info]')){const w=d.createElement('div');w.className='growth-info-wrap';w.dataset.growthInfo='';w.innerHTML='<button class="growth-info-btn" type="button" aria-expanded="false"><span>Growth Partnership</span><i>i</i></button><div class="growth-info-pop"><strong>Netcore acts as MTN One’s Growth Partner:</strong> the monthly price follows the highest MTU level reached that month, Alpha puts up to 20% of Netcore’s fee at risk above 5 million MTUs, and implementation and onboarding are included through 2026 before subscription billing begins 1 January 2027.</div>';hero.appendChild(w);const b=w.querySelector('button');b.addEventListener('click',e=>{e.stopPropagation();const open=w.classList.toggle('open');b.setAttribute('aria-expanded',String(open))});d.addEventListener('click',e=>{if(!w.contains(e.target)){w.classList.remove('open');b.setAttribute('aria-expanded','false')}});d.addEventListener('keydown',e=>{if(e.key==='Escape'){w.classList.remove('open');b.setAttribute('aria-expanded','false')}})}}const m=d.querySelector('.mobile-scale');if(m){m.innerHTML='<span><b>1</b><small>million MTUs</small></span><span><b>5</b><small>million MTUs</small></span><span><b>15</b><small>million MTUs</small></span><span><b>25</b><small>million MTUs</small></span><span><b>35</b><small>million MTUs</small></span>'}const selected=d.querySelector('[data-selected]');if(selected)selected.textContent=selected.textContent.replace(/(\d+(?:\.\d+)?)M\s*MTUs?/g,'$1 million MTUs');const band=d.querySelector('[data-band]');if(band)band.textContent=band.textContent.replace(/(\d+(?:\.\d+)?)M/g,'$1 million');const exactSuffix=d.querySelector('.exact span');if(exactSuffix)exactSuffix.textContent='million MTUs';const resize=()=>{inner.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+'px';o.style.height=Math.max(d19.documentElement.scrollHeight,d19.body.scrollHeight)+'px';host.style.height=Math.max(d20.documentElement.scrollHeight,d20.body.scrollHeight)+'px'};resize();if(!d.body.dataset.v21resize){d.body.dataset.v21resize='1';new ResizeObserver(resize).observe(d.body)}}function traverse(){try{patch()}catch(e){console.error(e)}}host.addEventListener('load',()=>{setTimeout(traverse,250);setTimeout(traverse,700);setTimeout(traverse,1400)});setInterval(traverse,1200)})();</script></body></html>
